name: Bug report
description: Report a reproducible Lenny installation, setup, conduct or evidence failure.
title: "[bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Lenny version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options: [Codex CLI, Codex app, Other]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Node version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Smallest reproduction
      description: Do not include credentials or private repository contents.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Lenny Doctor output
      description: Redact private paths or identifiers before pasting.
